name: Refresh Profile Widgets

on:
  schedule:
    - cron: "43 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/generate-profile-assets.mjs"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate profile widgets
        run: node .github/scripts/generate-profile-assets.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}

      - name: Commit refreshed widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats.svg assets/language-map.svg assets/momentum.svg
          if git diff --cached --quiet; then
            echo "Profile widgets are already up to date."
            exit 0
          fi
          git commit -m "chore: refresh profile widgets"
          git push
